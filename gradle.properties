# Opt-out de AGP 9 (built-in Kotlin + new DSL) mientras el proyecto usa el
# plugin org.jetbrains.kotlin.android (KGP 2.2.10). Se elimina en AGP 10.
# Alternativa a largo plazo: migrar a built-in Kotlin (ver gradle/libs.versions.toml).
android.builtInKotlin=false
android.newDsl=false
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
